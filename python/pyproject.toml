[project]
name = "metergraph"
version = "0.6.12"
description = "Zero-dependency Python SDK for function-level LLM cost attribution across major LLM providers and gateways, including OpenAI, Anthropic, Gemini, and Vercel AI Gateway."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Metergraph" }]
keywords = [
    "llm",
    "llm-cost",
    "llm-observability",
    "cost-attribution",
    "ai-agents",
    "openai",
    "anthropic",
    "gemini",
    "vercel-ai-sdk",
    "vercel-ai-gateway",
    "opentelemetry",
    "self-hosted",
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://www.metergraph.dev/"
Documentation = "https://github.com/metergraph/metergraphsdk/tree/main/python#readme"
Repository = "https://github.com/metergraph/metergraphsdk"
Issues = "https://github.com/metergraph/metergraphsdk/issues"
"Release notes" = "https://github.com/metergraph/metergraphsdk/releases"

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.30"]
dev = ["build>=1", "pytest>=8", "openai>=2.50.0,<3", "anthropic>=0.40,<1", "google-genai>=1", "opentelemetry-sdk>=1.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
